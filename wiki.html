<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI LLM Wiki</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* iRichGreen Design System — 웹 계층 DS 1.1.23(FD 기준판)을 따랐다. 색·크기는 아래 토큰만 쓴다. */
  :root {
    --brand-primary: #2f5bd1; --brand-navy: #1e3a6e;
    --bg-canvas: #f4f6f9; --bg-panel: #ffffff; --bg-raised: #f7f8fa;
    --line-default: #dfe3ea; --line-soft: #eceff4;
    --text-main: #1c1f26; --text-muted: #6b7280; --text-faint: #9aa3b2;
    --alert-info: #2563eb; --alert-warning: #d97706; --alert-done: #16a34a; --alert-critical: #dc2626;
    --info-10: rgba(37, 99, 235, .1); --info-30: rgba(37, 99, 235, .3);
    --done-10: rgba(22, 163, 74, .1); --done-30: rgba(22, 163, 74, .3);
    --warning-15: rgba(217, 119, 6, .15);
    --row-line: rgba(223, 227, 234, .6);
    --shadow-pop: 0 10px 32px -8px rgba(28, 25, 23, .18);
    --scrim: rgba(0, 0, 0, .5);
    --radius-8: 8px; --radius-10: 10px; --radius-12: 12px; --radius-card: 16px; --radius-full: 9999px;
    --space-4: 4px; --space-6: 6px; --space-8: 8px; --space-12: 12px; --space-16: 16px; --space-24: 24px; --space-32: 32px;
    --size-header: 48px; --size-btn-md: 32px; --size-btn-sm: 28px; --size-row: 30px; --content-max: 1600px;
    --font-web: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: var(--font-web); background: var(--bg-canvas); color: var(--text-main); font-size: 14px; line-height: 20px; font-variant-numeric: tabular-nums; }
  button, input, select { font: inherit; color: inherit; }
  a { color: var(--brand-primary); }
  :focus-visible { outline: 2px solid var(--brand-primary); outline-offset: 2px; }
  @media (prefers-reduced-motion: no-preference) { button, .chip, .opt, tr.row td { transition: background-color 150ms, color 150ms, border-color 150ms; } }

  /* ── 머리줄 48 · 검색 ── */
  .top { position: sticky; top: 0; z-index: 10; height: var(--size-header); background: var(--bg-panel); border-bottom: 1px solid var(--line-default); }
  .top-in { max-width: var(--content-max); height: 100%; margin: 0 auto; padding: 0 var(--space-32); display: flex; gap: var(--space-16); align-items: center; }
  .brand { display: flex; gap: var(--space-8); align-items: baseline; white-space: nowrap; }
  .brand b { font-size: 16px; line-height: 24px; font-weight: 800; }
  .brand span { font-size: 12px; line-height: 16px; color: var(--text-muted); }
  .qbox { flex: 1; max-width: 640px; height: var(--size-btn-md); display: flex; align-items: center; gap: var(--space-6);
    background: var(--bg-panel); border: 1px solid var(--line-default); border-radius: var(--radius-10); padding: 0 var(--space-6) 0 var(--space-12); margin-left: auto; }
  .qbox:focus-within { outline: 2px solid var(--brand-primary); outline-offset: -1px; border-color: transparent; }
  .qbox svg { flex: none; color: var(--text-muted); }
  .qbox input { flex: 1; border: 0; background: transparent; font-size: 14px; font-weight: 500; outline: none; min-width: 0; height: 100%; }
  .qbox input::placeholder { color: var(--text-muted); font-weight: 400; }
  .qbox input::-webkit-search-cancel-button { display: none; }
  .qbox kbd { font: 700 12px/16px var(--font-web); color: var(--text-muted); border: 1px solid var(--line-default); border-radius: 4px; padding: 0 6px; }
  .qclear { border: 0; background: none; color: var(--text-muted); cursor: pointer; width: 22px; height: 22px; border-radius: var(--radius-full); display: none; place-items: center; }
  .qclear:hover { background: var(--bg-raised); color: var(--text-main); }
  .actions { display: flex; gap: var(--space-8); }
  .btn { height: var(--size-btn-md); border: 1px solid transparent; border-radius: var(--radius-10); padding: 0 var(--space-12);
    font-size: 13px; line-height: 20px; font-weight: 700; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: var(--space-6); }
  .btn-primary { background: var(--brand-primary); color: #fff; }
  .btn-secondary { background: var(--bg-panel); border-color: var(--line-default); color: var(--text-main); }
  .btn-secondary:hover { background: var(--bg-raised); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn-filter { display: none; }

  /* ── 본문 ── */
  .wrap { max-width: var(--content-max); margin: 0 auto; padding: var(--space-24) var(--space-32) var(--space-32);
    display: grid; grid-template-columns: 264px minmax(0, 1fr); gap: var(--space-16); align-items: start; }
  .card { background: var(--bg-panel); border: 1px solid var(--line-default); border-radius: var(--radius-card); }

  /* 필터 카드 */
  aside.card { position: sticky; top: calc(var(--size-header) + var(--space-24)); max-height: calc(100vh - var(--size-header) - 48px); overflow: auto; padding: var(--space-4) var(--space-16); }
  .facet { padding: var(--space-12) 0; border-bottom: 1px solid var(--line-soft); }
  .facet:last-child { border-bottom: 0; }
  .facet h3 { font-size: 13px; line-height: 20px; font-weight: 700; margin-bottom: var(--space-8); display: flex; justify-content: space-between; align-items: center; }
  .facet h3 small { font-size: 12px; line-height: 16px; font-weight: 400; color: var(--text-muted); }
  .side-head { display: flex; justify-content: space-between; align-items: center; padding: var(--space-12) 0 var(--space-4); }
  .side-head b { font-size: 16px; line-height: 24px; font-weight: 800; }
  .txtbtn { border: 0; background: none; color: var(--brand-primary); font-size: 13px; font-weight: 700; cursor: pointer; padding: 0; }
  .txtbtn:disabled { color: var(--text-faint); cursor: default; }
  /* SegmentedControl — 하나만 고르기 */
  .seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 2px; background: var(--bg-raised); border: 1px solid var(--line-default); border-radius: var(--radius-10); }
  .seg button { height: 26px; border: 0; background: transparent; border-radius: var(--radius-8); padding: 0 var(--space-8); font-size: 13px; font-weight: 700; color: var(--text-muted); cursor: pointer; }
  .seg button:hover { color: var(--text-main); }
  .seg button[aria-pressed="true"] { background: var(--info-10); color: var(--alert-info); }
  .seg button .n { font-size: 12px; font-weight: 400; margin-left: 2px; }
  /* FilterChip — 여러 개 켜고 끄기 */
  .fchips { display: flex; flex-wrap: wrap; gap: var(--space-6); }
  .fchip { height: var(--size-btn-sm); border: 1px solid var(--line-default); background: var(--bg-panel); border-radius: var(--radius-full); padding: 0 var(--space-12); font-size: 13px; font-weight: 700; color: var(--text-main); cursor: pointer; }
  .fchip[aria-pressed="true"] { background: var(--info-10); border-color: var(--info-30); color: var(--alert-info); }
  .fchip .n { font-size: 12px; font-weight: 400; color: var(--text-muted); margin-left: 2px; }
  .opts { display: flex; flex-direction: column; }
  .opts.scroll { max-height: 264px; overflow: auto; margin-right: calc(-1 * var(--space-8)); padding-right: var(--space-8); }
  .opt { display: flex; align-items: center; gap: var(--space-8); min-height: 28px; padding: 0 var(--space-4); border-radius: var(--radius-8); cursor: pointer; font-size: 13px; }
  .opt:hover { background: var(--bg-raised); }
  .opt input { accent-color: var(--brand-primary); width: 16px; height: 16px; flex: none; }
  .opt .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .opt .n { color: var(--text-muted); font-size: 12px; }
  .opt.zero .lbl, .opt.zero .n { color: var(--text-faint); }
  .fsearch { width: 100%; height: var(--size-btn-md); border: 1px solid var(--line-default); background: var(--bg-panel); border-radius: var(--radius-10); padding: 0 var(--space-12); font-size: 13px; margin-bottom: var(--space-8); }
  .fsearch:focus { outline: 2px solid var(--brand-primary); outline-offset: -1px; }
  .more { border: 0; background: none; color: var(--brand-primary); font-size: 13px; font-weight: 700; cursor: pointer; padding: var(--space-6) var(--space-4) 0; }
  .dates { display: flex; gap: var(--space-6); align-items: center; margin-top: var(--space-8); font-size: 12px; color: var(--text-muted); }
  .dates input { flex: 1; min-width: 0; height: var(--size-btn-md); border: 1px solid var(--line-default); background: var(--bg-panel); border-radius: var(--radius-10); padding: 0 var(--space-6); font-size: 13px; }
  .modeline { display: flex; gap: var(--space-8); align-items: center; justify-content: space-between; font-size: 12px; line-height: 16px; color: var(--text-muted); margin-bottom: var(--space-8); }

  /* ── 결과 머리 ── */
  .rhead { display: flex; flex-wrap: wrap; gap: var(--space-8) var(--space-16); align-items: center; margin-bottom: var(--space-12); min-height: var(--size-btn-md); }
  .count { font-size: 14px; color: var(--text-muted); }
  .count b { font-size: 20px; line-height: 28px; font-weight: 800; color: var(--text-main); margin-right: 2px; }
  .mode { font-size: 12px; line-height: 16px; color: var(--text-muted); }
  .mode.warn { color: var(--alert-warning); font-weight: 700; }
  .rtools { margin-left: auto; display: flex; gap: var(--space-8); align-items: center; }
  .rtools select { height: var(--size-btn-md); border: 1px solid var(--line-default); background: var(--bg-panel); border-radius: var(--radius-10); padding: 0 var(--space-8); font-size: 13px; }
  .active { display: flex; flex-wrap: wrap; gap: var(--space-6); align-items: center; margin-bottom: var(--space-12); }
  .active:empty { display: none; }
  .chip { display: inline-flex; align-items: center; gap: var(--space-4); height: 24px; background: var(--info-10); border: 1px solid var(--info-30); color: var(--alert-info);
    border-radius: var(--radius-full); padding: 0 var(--space-4) 0 var(--space-12); font-size: 12px; font-weight: 700; }
  .chip button { border: 0; background: none; color: inherit; cursor: pointer; width: 18px; height: 18px; border-radius: var(--radius-full); display: grid; place-items: center; }
  .chip button:hover { background: var(--info-30); }

  /* ── AI 답변 ── */
  .answer { display: none; padding: var(--space-16); margin-bottom: var(--space-16); }
  .answer h2 { font-size: 16px; line-height: 24px; font-weight: 800; margin-bottom: var(--space-8); display: flex; justify-content: space-between; align-items: center; }
  .answer .body { white-space: pre-wrap; line-height: 24px; max-width: 80ch; }
  .answer .src { margin-top: var(--space-12); padding-top: var(--space-12); border-top: 1px solid var(--line-soft); font-size: 13px; display: grid; gap: var(--space-4); }
  .answer .src b { font-size: 13px; font-weight: 700; color: var(--text-muted); }
  .answer .src a { text-decoration: none; }
  .answer .src a:hover { text-decoration: underline; }

  /* ── 표 (홀로 놓인 표 상자 = radius-card) ── */
  .tablebox { overflow: clip; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  thead th { position: sticky; top: var(--size-header); z-index: 5; background: var(--bg-raised); border-bottom: 1px solid var(--line-default);
    text-align: left; font-size: 13px; line-height: 20px; font-weight: 900; color: var(--text-muted); padding: 0; height: var(--size-row); }
  th button { width: 100%; height: var(--size-row); text-align: inherit; border: 0; background: none; padding: 0 var(--space-12); cursor: pointer; color: inherit; font-weight: inherit; display: flex; gap: var(--space-4); align-items: center; }
  th.r button { justify-content: flex-end; }
  th button:hover { color: var(--text-main); }
  th[aria-sort="ascending"] button, th[aria-sort="descending"] button { color: var(--brand-primary); }
  th .arr { font-size: 12px; width: 12px; }
  td { height: var(--size-row); padding: 5px var(--space-12); border-bottom: 1px solid var(--row-line); vertical-align: middle; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  td.r { text-align: right; }
  tr.row { cursor: pointer; }
  tr.row:hover td { background: var(--bg-raised); }
  tr.row.open td { background: var(--bg-raised); border-bottom-color: transparent; }
  .ttl { display: flex; align-items: center; gap: var(--space-6); min-width: 0; }
  .ttl .t { overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
  tr.row.open .ttl .t { font-weight: 700; }
  .st { flex: none; height: 20px; display: inline-flex; align-items: center; padding: 0 var(--space-6); border-radius: var(--radius-8); font-size: 12px; line-height: 16px; font-weight: 700; }
  .st.done { background: var(--done-10); border: 1px solid var(--done-30); color: var(--alert-done); }
  .st.neutral { background: var(--bg-raised); border: 1px solid var(--line-default); color: var(--text-muted); }
  .tags { display: flex; gap: var(--space-4); overflow: hidden; }
  .tag { flex: none; font-size: 12px; line-height: 16px; height: 20px; display: inline-flex; align-items: center; background: var(--bg-panel); border: 1px solid var(--line-default); border-radius: var(--radius-full); padding: 0 var(--space-8); color: var(--text-main); cursor: pointer; }
  .tag:hover { border-color: var(--brand-primary); color: var(--brand-primary); }
  .tag.on { background: var(--info-10); border-color: var(--info-30); color: var(--alert-info); font-weight: 700; }
  .faint { color: var(--text-faint); }
  .muted { color: var(--text-muted); }
  .rel { display: inline-flex; align-items: center; gap: var(--space-6); justify-content: flex-end; }
  .rel i { display: block; height: 6px; border-radius: var(--radius-full); background: var(--brand-primary); }
  .detail td { white-space: normal; height: auto; padding: 0 var(--space-12) var(--space-16); background: var(--bg-raised); border-bottom: 1px solid var(--line-default); }
  .dgrid { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: var(--space-16); padding-top: var(--space-4); }
  .thumb { width: 100%; aspect-ratio: 16/9; border-radius: var(--radius-12); background: var(--line-soft); overflow: hidden; display: grid; place-items: center; color: var(--text-faint); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .snip { font-size: 14px; line-height: 24px; max-width: 80ch; }
  .dmeta { margin-top: var(--space-8); font-size: 12px; line-height: 16px; color: var(--text-muted); }
  .links { display: flex; gap: var(--space-16); margin-top: var(--space-12); font-size: 13px; font-weight: 700; flex-wrap: wrap; }
  .links a { text-decoration: none; display: inline-flex; gap: var(--space-4); align-items: center; }
  .links a:hover { text-decoration: underline; }
  .links svg { opacity: .7; }
  mark { background: var(--warning-15); color: inherit; border-radius: 2px; }
  .col-chan { width: 17%; } .col-topic { width: 22%; } .col-date { width: 116px; } .col-views { width: 84px; } .col-rel { width: 112px; }

  /* ── 카드 보기 ── */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(264px, 1fr)); gap: var(--space-16); }
  .vcard { overflow: hidden; display: flex; flex-direction: column; }
  .vcard .thumb { border-radius: 0; }
  .vcard .cb { padding: var(--space-12) var(--space-16) var(--space-16); display: flex; flex-direction: column; gap: var(--space-8); flex: 1; }
  .vcard .title { font-weight: 700; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .vcard .meta { color: var(--text-muted); font-size: 12px; line-height: 16px; }
  .vcard .snip { font-size: 13px; line-height: 20px; color: var(--text-muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .vcard .tags { flex-wrap: wrap; }
  .vcard .links { margin-top: auto; padding-top: var(--space-4); }

  .empty { padding: var(--space-24) var(--space-16); text-align: center; color: var(--text-muted); }
  .empty b { display: block; color: var(--text-main); font-size: 16px; line-height: 24px; font-weight: 800; margin-bottom: var(--space-4); }
  .sentinel { height: 1px; }
  .skel td { height: var(--size-row); }
  .skel i { display: block; height: 12px; border-radius: 4px; background: var(--line-soft); }
  @media (prefers-reduced-motion: no-preference) { .skel i { animation: pulse 1.4s ease-in-out infinite; } }
  @keyframes pulse { 50% { opacity: .45; } }

  /* ── 좁은 화면 (DS 1.1.23 에 모바일 기준이 없어 이 화면에서만 정함) ── */
  @media (max-width: 1100px) { .wrap { grid-template-columns: 232px minmax(0, 1fr); } }
  @media (max-width: 860px) {
    .top { height: auto; }
    .top-in { flex-wrap: wrap; gap: var(--space-8); padding: var(--space-8) var(--space-16); }
    .qbox { order: 3; max-width: none; flex-basis: 100%; margin-left: 0; }
    .qbox kbd { display: none; }
    .actions { margin-left: auto; }
    .btn-filter { display: inline-flex; }
    .wrap { grid-template-columns: 1fr; padding: var(--space-16); }
    aside.card { position: fixed; z-index: 60; inset: 0 auto 0 0; top: 0; width: min(320px, 88vw); max-height: none; border-radius: 0 var(--radius-card) var(--radius-card) 0;
      transform: translateX(-102%); }
    aside.card.show { transform: none; box-shadow: var(--shadow-pop); }
    .scrim { position: fixed; inset: 0; z-index: 59; background: var(--scrim); display: none; }
    .scrim.show { display: block; }
    thead th { top: 0; }
    .dgrid { grid-template-columns: 1fr; }
    .hide-sm { display: none; }
  }
  @media (prefers-reduced-motion: no-preference) and (max-width: 860px) { aside.card { transition: transform 300ms; } }
  .st.new { background: var(--info-10); border: 1px solid var(--info-30); color: var(--alert-info); }
  .btn-icon svg { flex: none; }
  /* 노트 전체 보기 — 떠 있는 패널이라 그림자 web.shadow.pop 하나 */
  .panel { position: fixed; z-index: 60; top: 0; right: 0; bottom: 0; width: min(680px, 100vw); background: var(--bg-panel); border-left: 1px solid var(--line-default);
    box-shadow: var(--shadow-pop); display: flex; flex-direction: column; transform: translateX(100%); }
  .panel.show { transform: none; }
  @media (prefers-reduced-motion: no-preference) { .panel { transition: transform 200ms; } }
  .phead { flex: none; height: var(--size-header); display: flex; align-items: center; gap: var(--space-8); padding: 0 var(--space-16); border-bottom: 1px solid var(--line-default); }
  .phead h2 { flex: 1; min-width: 0; font-size: 16px; line-height: 24px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .iconbtn { flex: none; width: var(--size-btn-md); height: var(--size-btn-md); border: 1px solid var(--line-default); background: var(--bg-panel); border-radius: var(--radius-10); cursor: pointer; display: grid; place-items: center; color: var(--text-main); }
  .iconbtn:hover { background: var(--bg-raised); }
  .pbody { flex: 1; overflow: auto; padding: var(--space-16) var(--space-24) var(--space-32); }
  .pthumb { display: block; max-width: 360px; margin-bottom: var(--space-12); }
  .pmeta { font-size: 12px; line-height: 16px; color: var(--text-muted); margin-bottom: var(--space-8); }
  .pbody .tags { flex-wrap: wrap; }
  .md { margin-top: var(--space-16); padding-top: var(--space-16); border-top: 1px solid var(--line-soft); max-width: 72ch; }
  .md h2, .md h3 { font-size: 16px; line-height: 24px; font-weight: 800; margin: var(--space-24) 0 var(--space-8); }
  .md h4 { font-size: 14px; line-height: 20px; font-weight: 700; margin: var(--space-16) 0 var(--space-6); }
  .md > :first-child { margin-top: 0; }
  .md p { margin: 0 0 var(--space-12); line-height: 24px; }
  .md ul, .md ol { margin: 0 0 var(--space-12); padding-left: 20px; }
  .md li { line-height: 24px; margin-bottom: var(--space-4); }
  .md li > ul, .md li > ol { margin: var(--space-4) 0 0; }
  .md hr { border: 0; border-top: 1px solid var(--line-soft); margin: var(--space-16) 0; }
  .md code { font-size: 13px; background: var(--bg-raised); border: 1px solid var(--line-soft); border-radius: 4px; padding: 0 4px; }
  .md a { text-decoration: none; } .md a:hover { text-decoration: underline; }
  .md .wl { color: var(--text-muted); }
  .sim { margin-top: var(--space-24); padding-top: var(--space-16); border-top: 1px solid var(--line-soft); }
  .sim h3 { font-size: 16px; line-height: 24px; font-weight: 800; margin-bottom: var(--space-8); }
  .simrow { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: var(--space-12); align-items: center; padding: var(--space-8); border-radius: var(--radius-12); text-decoration: none; color: inherit; }
  .simrow:hover { background: var(--bg-raised); }
  .simrow b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: 700; }
  .simrow small { display: block; font-size: 12px; line-height: 16px; color: var(--text-muted); margin-top: 2px; }
  .linkbtn { border: 0; background: none; color: var(--brand-primary); font: inherit; font-weight: 700; cursor: pointer; padding: 0; }
  .linkbtn:hover { text-decoration: underline; }
  .vcard .title { cursor: pointer; }

<body>
<header class="top">

</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nfc = s => String(s ?? '').normalize('NFC');
// Obsidian 링크는 Vault 가 있는 이 맥에서만 의미가 있다. 가족 PC(집 안 전용 서버)에서는 숨긴다.
const IS_LOCAL = ['localhost', '127.0.0.1'].includes(location.hostname);
const RELEVANT_TOP = 200;   // 의미 검색은 점수 상위 200건을 "관련 결과"로 본다
const PAGE = 80;            // 한 번에 그리는 줄 수 (스크롤하면 이어서)
const TOPIC_EXCLUDE = new Set(['AI 꿀팁']);
const EXT = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>';

// ── 상태 (URL 해시와 맞춘다) ──
const S = {
  q: '', kind: 'all', topics: new Set(), topicMode: 'any', period: 'all', from: '', to: '',
  views: 0, summary: 'all', channels: new Set(), cats: new Set(), imp: new Set(), onlyNew: false,
  sort: 'date', dir: 'desc', view: 'table',
};
let ALL = [], BY_ID = new Map(), SCORES = null, MODE = 'list', REL = null, LIST = [], shown = 0, openId = null;
let chanLimit = 8, REL_TOP = 1, REL_LOW = 0, searchSeq = 0, BUILT = '';

const KIND = [['all', '전체'], ['video', '영상'], ['tip', '꿀팁']];
const PERIOD = [['all', '전체'], ['7', '1주'], ['30', '1달'], ['90', '3달'], ['365', '1년']];
const VIEWS = [[0, '전체'], [1000, '1천+'], [10000, '1만+'], [100000, '10만+']];
const IMP = ['상', '중', '하'];
const SORTS = [
  ['rel', '관련도순', 'desc'], ['date', '최신순', 'desc'], ['date_asc', '오래된순', 'asc'], ['views', '조회수순', 'desc'],
  ['title', '제목순', 'asc'], ['channel', '채널순', 'asc'],
];
const SORT_NAME = { rel: '관련도', date: '날짜', views: '조회수', title: '제목', channel: '채널', topic: '토픽' };

// ── 숫자 표기 (DS 1.1.23: 1만 이상은 만 · 정수 + 쉼표, 빈 값은 -) ──
const fmtNum = n => Number(n).toLocaleString('ko-KR');
function fmtShort(n) {
  if (!n) return '-';
  if (n >= 100000000) return (Math.round(n / 1000000) / 100).toFixed(2) + '억';
  if (n >= 10000) return fmtNum(Math.round(n / 10000)) + '만';
  return fmtNum(n);
}
const dayMs = 86400000;
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const isoDay = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);

// ── 데이터 준비 ──
function prep(n) {
  n.title = nfc(n.title); n.channel = nfc(n.channel); n.topic = nfc(n.topic);
  n.tags = (n.tags || []).map(nfc);
  n.kind = n.kind || (n.video_url ? 'video' : 'tip');
  const ts = new Set(n.tags); if (n.topic && !TOPIC_EXCLUDE.has(n.topic)) ts.add(n.topic);
  n._topics = [...ts];
  n._views = Number(n.view_count) || 0;
  n._date = n.upload_date || '';
  n._chan = n.kind === 'tip' ? (n.channel || '').replace(/^https?:\/\//, '').replace(/^www\./, '').replace(/\/.*$/, '') : n.channel;
  n._vid = n.video_url ? (n.video_url.match(/(?:v=|youtu\.be\/|shorts\/)([\w-]{11})/) || [])[1] : '';
  return n;
}

// ── 필터 ──
function passes(n, skip) {
  if (skip !== 'kind' && S.kind !== 'all' && n.kind !== S.kind) return false;
  if (skip !== 'topics' && S.topics.size) {
    if (S.topicMode === 'all') { for (const t of S.topics) if (!n._topics.includes(t)) return false; }
    else if (!n._topics.some(t => S.topics.has(t))) return false;
  }
  if (skip !== 'period') {
    if (S.from && n._date < S.from) return false;
    if (S.to && n._date > S.to) return false;
  }
  if (skip !== 'views' && S.views && n._views < S.views) return false;
  if (skip !== 'summary' && S.summary === 'video' && n.summary_src !== 'video') return false;
  if (skip !== 'channels' && S.channels.size && !S.channels.has(n._chan)) return false;
  if (skip !== 'cats' && S.cats.size && !S.cats.has(n.category || '기타')) return false;
  if (skip !== 'imp' && S.imp.size && !S.imp.has(n.importance)) return false;
  if (skip !== 'new' && S.onlyNew && !NEWSET.has(n.id)) return false;
  return true;
}
const base = () => REL || ALL;
const periodRange = p => p === 'all' ? ['', ''] : [isoDay(new Date(today().getTime() - Number(p) * dayMs)), ''];

// ── 정렬 ──
const cmpStr = (a, b) => (a || '').localeCompare(b || '', 'ko');
function sorter() {
  const d = S.dir === 'asc' ? 1 : -1;
  switch (S.sort) {
    case 'rel': return (a, b) => d * ((SCORES[a.id] ?? -9) - (SCORES[b.id] ?? -9)) || cmpStr(b._date, a._date);
    case 'views': return (a, b) => d * (a._views - b._views) || cmpStr(b._date, a._date);
    case 'title': return (a, b) => d * cmpStr(a.title, b.title);
    case 'channel': return (a, b) => d * cmpStr(a._chan, b._chan) || cmpStr(b._date, a._date);
    case 'topic': return (a, b) => d * cmpStr(a._topics[0] || '힣', b._topics[0] || '힣') || cmpStr(b._date, a._date);
    default: return (a, b) => d * cmpStr(a._date, b._date) || cmpStr(a.title, b.title);
  }
}

// ── 검색어 강조 ──
let HL = null;
function setHighlight(q) {
  const toks = nfc(q).toLowerCase().split(/[\s,.?!'"()\[\]]+/).filter(t => t.length >= 2)
    .map(t => esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  HL = toks.length ? new RegExp('(' + toks.join('|') + ')', 'gi') : null;
}
const hl = s => HL ? esc(s).replace(HL, '<mark>$1</mark>') : esc(s);
// 요약 미리보기는 마크다운 원문이라 **굵게**·[[링크]] 표시만 정리한다
const md = s => hl(String(s || '').replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, a, b) => b || a)).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*\*/g, '');

// ── 필터 패널 ──
function countBy(skip, keyFn) {
  const m = new Map();
  for (const n of base()) {
    if (!passes(n, skip)) continue;
    for (const k of keyFn(n)) m.set(k, (m.get(k) || 0) + 1);
  }
  return m;
}
const segHtml = (items, cur, counts, cls = '') => items.map(([v, l]) =>
  `<button type="button" class="${cls}" data-v="${esc(v)}" aria-pressed="${String(v) === String(cur)}">${esc(l)}${counts ? `<span class="n">${fmtNum(counts.get(v) || 0)}</span>` : ''}</button>`).join('');
const optHtml = (entries, selected, name) => entries.map(([k, c]) =>
  `<label class="opt${c ? '' : ' zero'}"><input type="checkbox" name="${name}" value="${esc(k)}" ${selected.has(k) ? 'checked' : ''}><span class="lbl" title="${esc(k)}">${esc(k)}</span><span class="n">${fmtNum(c)}</span></label>`).join('');
const sortedEntries = (counts, selected, find) => [...new Set([...counts.keys(), ...selected])].map(k => [k, counts.get(k) || 0])
  .filter(([k]) => !find || k.toLowerCase().includes(find))
  .sort((a, b) => (selected.has(b[0]) - selected.has(a[0])) || b[1] - a[1] || cmpStr(a[0], b[0]));

function renderFacets() {
  $('fKind').innerHTML = segHtml(KIND, S.kind, countBy('kind', n => ['all', n.kind]), 'fchip');
  const tf = nfc($('topicFind').value.trim()).toLowerCase();
  $('fTopics').innerHTML = optHtml(sortedEntries(countBy('topics', n => n._topics), S.topics, tf), S.topics, 'topic') || '<div class="opt zero"><span class="lbl">맞는 토픽이 없습니다</span></div>';
  $('topicSel').textContent = S.topics.size ? `${S.topics.size}개 선택` : '';
  $('fTopicMode').innerHTML = segHtml([['any', '하나라도'], ['all', '모두']], S.topicMode);
  $('fPeriod').innerHTML = segHtml(PERIOD, S.period === 'custom' ? '' : S.period, null, 'fchip');
  $('dFrom').value = S.from; $('dTo').value = S.to;
  $('fViews').innerHTML = segHtml(VIEWS, S.views, null, 'fchip');
  const sc = countBy('summary', n => n.kind === 'video' && n.summary_src === 'video' ? ['video'] : []);
  $('fSummary').innerHTML = `<label class="opt"><input type="checkbox" id="sumVideo" ${S.summary === 'video' ? 'checked' : ''}><span class="lbl">영상을 보고 만든 요약만</span><span class="n">${fmtNum(sc.get('video') || 0)}</span></label>`;
  const cf = nfc($('chanFind').value.trim()).toLowerCase();
  const chans = sortedEntries(countBy('channels', n => n._chan ? [n._chan] : []), S.channels, cf);
  const lim = cf ? 40 : chanLimit;
  $('fChannels').innerHTML = optHtml(chans.slice(0, lim), S.channels, 'chan') || '<div class="opt zero"><span class="lbl">맞는 채널이 없습니다</span></div>';
  $('chanMore').textContent = chans.length > lim ? `${fmtNum(chans.length - lim)}개 더 보기` : (chanLimit > 8 && !cf ? '접기' : '');
  $('chanMore').style.display = $('chanMore').textContent ? '' : 'none';
  $('chanSel').textContent = S.channels.size ? `${S.channels.size}개 선택` : `${fmtNum(chans.length)}개`;
  $('tipFacets').style.display = S.kind === 'video' ? 'none' : '';
  $('fCategory').innerHTML = optHtml(sortedEntries(countBy('cats', n => n.kind === 'tip' ? [n.category || '기타'] : []), S.cats, ''), S.cats, 'cat');
  const ic = countBy('imp', n => n.kind === 'tip' && n.importance ? [n.importance] : []);
  $('fImportance').innerHTML = IMP.map(v => `<button type="button" class="fchip" data-v="${v}" aria-pressed="${S.imp.has(v)}">${v}<span class="n">${fmtNum(ic.get(v) || 0)}</span></button>`).join('');
  const nc = countBy('new', n => NEWSET.has(n.id) ? ['new'] : []).get('new') || 0;
  $('fNew').innerHTML = NEWSET.size ? `<label class="opt"><input type="checkbox" id="onlyNew" ${S.onlyNew ? 'checked' : ''}><span class="lbl">지난 방문 뒤 새로 들어온 것만</span><span class="n">${fmtNum(nc)}</span></label>` : '';
  $('sideClear').disabled = !hasFilters();
  $('btnFilter').textContent = hasFilters() ? `필터 ${activeChips().length}` : '필터';
  $('fView').innerHTML = segHtml([['table', '표'], ['card', '카드']], S.view);
}

// ── 켜진 필터 칩 ──
function activeChips() {
  const c = [];
  if (S.kind !== 'all') c.push(['kind', '', KIND.find(k => k[0] === S.kind)[1]]);
  for (const t of S.topics) c.push(['topic', t, t]);
  if (S.from || S.to) c.push(['period', '', S.period !== 'custom' ? '최근 ' + PERIOD.find(p => p[0] === S.period)[1] : `${S.from || '처음'} ~ ${S.to || '오늘'}`]);
  if (S.views) c.push(['views', '', '조회수 ' + VIEWS.find(v => v[0] === S.views)[1]]);
  if (S.summary === 'video') c.push(['summary', '', '영상을 보고 만든 요약']);
  for (const ch of S.channels) c.push(['chan', ch, ch]);
  for (const ct of S.cats) c.push(['cat', ct, '꿀팁 ' + ct]);
  for (const im of S.imp) c.push(['imp', im, '중요도 ' + im]);
  if (S.onlyNew) c.push(['new', '', '새로 들어온 것']);
  return c;
}
function renderChips() {
  const c = activeChips();
  const modeTxt = S.topics.size > 1 ? `<span class="mode">토픽은 ${S.topicMode === 'all' ? '모두 포함' : '하나라도 포함'}</span>` : '';
  $('chips').innerHTML = c.map(([k, v, l]) =>
    `<span class="chip">${esc(l)}<button type="button" data-k="${k}" data-v="${esc(v)}" aria-label="${esc(l)} 빼기"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></span>`).join('') + modeTxt;
}

// ── 결과 ──
function apply() {
  LIST = base().filter(n => passes(n, null)).sort(sorter());
  shown = 0;
  const total = ALL.length;
  if (MODE === 'list') {
    $('count').innerHTML = LIST.length === total ? `<b>${fmtNum(total)}</b>건` : `<b>${fmtNum(LIST.length)}</b>건 · 전체 ${fmtNum(total)}건`;
    $('mode').className = 'mode'; $('mode').textContent = '';
  } else {
    $('count').innerHTML = `<b>${fmtNum(LIST.length)}</b>건 · ‘${esc(S.q)}’ 관련`;
    $('mode').className = MODE === 'keyword' ? 'mode warn' : 'mode';
    $('mode').textContent = MODE === 'keyword' ? '의미 검색 한도에 걸려 글자가 맞는 것만 찾았습니다' : `관련도 상위 ${RELEVANT_TOP}건 안에서`;
  }
  renderFacets(); renderChips(); renderSortSel(); writeHash();
  const box = $('results');
  if (!LIST.length) {
    box.innerHTML = `<div class="card empty"><b>조건에 맞는 항목이 없습니다</b>${hasFilters() ? '필터를 하나씩 빼 보세요. <button class="txtbtn" type="button" id="emptyClear">필터 모두 지우기</button>' : MODE !== 'list' ? '다른 말로 검색해 보세요.' : ''}</div>`;
    return;
  }
  if (S.view === 'table') {
    const relCol = MODE !== 'list';
    box.innerHTML = `<div class="card tablebox"><table>
      <colgroup><col><col class="col-chan"><col class="col-topic hide-sm"><col class="col-date"><col class="col-views hide-sm">${relCol ? '<col class="col-rel">' : ''}</colgroup>
      <thead><tr>${th('title', '제목')}${th('channel', '채널')}${th('topic', '토픽', 'hide-sm')}${th('date', '올라온 날', 'r')}${th('views', '조회수', 'r hide-sm')}${relCol ? th('rel', '관련도', 'r') : ''}</tr></thead>
      <tbody id="tb"></tbody></table><div class="sentinel" id="sentinel"></div></div>`;
  } else {
    box.innerHTML = `<div class="grid" id="tb"></div><div class="sentinel" id="sentinel"></div>`;
  }
  more();
  io.observe($('sentinel'));
}
function th(key, label, cls = '') {
  const active = S.sort === key;
  const sortAttr = active ? (S.dir === 'asc' ? 'ascending' : 'descending') : 'none';
  return `<th class="${cls}" aria-sort="${sortAttr}"><button type="button" data-sort="${key}">${label}<span class="arr" aria-hidden="true">${active ? (S.dir === 'asc' ? '▲' : '▼') : ''}</span></button></th>`;
}
function thumb(n) {

function writeHash() {

  if (S.period === 'custom') { if (S.from) p.set('from', S.from); if (S.to) p.set('to', S.to); }
  if (S.views) p.set('views', S.views);
  if (S.summary !== 'all') p.set('sum', S.summary);
  if (S.channels.size) p.set('ch', [...S.channels].join('|'));
  if (S.cats.size) p.set('cat', [...S.cats].join('|'));

function readHash() {

// ── 검색 ──
async function runSearch(q) {
  q = (q || '').trim();
  S.q = q; $('q').value = q; $('qclear').style.display = q ? 'grid' : 'none';
  setHighlight(q); openId = null;
  if (!q) {
    MODE = 'list'; SCORES = null; REL = null;
    if (S.sort === 'rel') { S.sort = 'date'; S.dir = 'desc'; }
    apply(); return;
  }
  const seq = ++searchSeq;
  $('btnSearch').disabled = true;
  $('count').innerHTML = '찾는 중입니다'; $('mode').textContent = '';
  try {
    const r = await fetch('/api/wiki-search?scores=1&q=' + encodeURIComponent(q));
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || r.status);
    if (seq !== searchSeq) return;
    if (data.built && data.built !== BUILT) await loadAll(true);
    SCORES = data.scores; MODE = data.mode;
    const ranked = ALL.filter(n => SCORES[n.id] != null).sort((a, b) => SCORES[b.id] - SCORES[a.id]);
    REL = MODE === 'vector' ? ranked.slice(0, RELEVANT_TOP) : ranked;
    REL_TOP = REL.length ? SCORES[REL[0].id] : 1;
    REL_LOW = REL.length ? SCORES[REL[REL.length - 1].id] : 0;
    S.sort = 'rel'; S.dir = 'desc';
    apply();
  } catch (e) {
    $('count').textContent = '검색하지 못했습니다';
    $('mode').className = 'mode warn'; $('mode').textContent = String(e.message || e) + ' — 잠시 뒤 다시 시도하세요';
  } finally {
    $('btnSearch').disabled = false;
  }
}

async function ask() {
  const q = $('q').value.trim();
  if (!q) { $('q').focus(); return; }
  if (q !== S.q) runSearch(q);
  const box = $('answer');
  $('btnAsk').disabled = true;
  box.style.display = 'block';
  box.innerHTML = '<h2>AI 답변</h2><div class="body muted">관련 자료를 읽고 답을 정리하고 있습니다. 10~20초 걸립니다.</div>';
  try {
    const r = await fetch('/api/wiki-ask', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ question: q }) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || r.status);
    const src = (data.sources || []).map(s => `<a href="${esc(s.video_url || '#')}" target="_blank" rel="noopener">[${s.n}] ${esc(s.title)} · ${esc(s.channel)} · ${esc(s.upload_date)}</a>`).join('');
    box.innerHTML = `<h2>AI 답변 <button class="txtbtn" type="button" id="ansClose">닫기</button></h2><div class="body">${esc(data.answer)}</div>${src ? `<div class="src"><b>근거 자료</b>${src}</div>` : ''}`;
  } catch (e) {
    box.innerHTML = `<h2>AI 답변 <button class="txtbtn" type="button" id="ansClose">닫기</button></h2><div class="body">답변을 만들지 못했습니다(${esc(e.message)}). 아래 검색 결과를 참고하세요.</div>`;
  } finally {
    $('btnAsk').disabled = false;
  }
}

// ── 전체 목록 ──
async function loadAll(silent) {
  if (!silent) $('results').innerHTML = `<div class="card tablebox"><table><tbody>${'<tr class="skel"><td><i style="width:56%"></i></td><td><i style="width:70%"></i></td><td><i style="width:50%"></i></td></tr>'.repeat(12)}</tbody></table></div>`;
  const r = await fetch('/api/wiki-search?all=1');
  if (!r.ok) throw new Error('목록 응답 ' + r.status);
  const data = await r.json();
  BUILT = data.built;
  ALL = data.notes.map(prep);
  BY_ID = new Map(ALL.map(n => [n.id, n]));
  BY_BASE = new Map(ALL.map(n => [nfc((n.path || '').split('/').pop().replace(/\.md$/, '')), n.id]));
  computeNew();
  const tips = ALL.filter(n => n.kind === 'tip').length;
  $('brandSub').textContent = `영상 ${fmtNum(ALL.length - tips)}건 · 꿀팁 ${fmtNum(tips)}건`;
}

  const rel = MODE !== 'list';
  const cols = [
    { h: '제목', w: 60 }, { h: '종류', w: 8 }, { h: '채널', w: 24 }, { h: '구독자', w: 10, t: 'n' }, { h: '토픽', w: 36 },
    { h: '올라온 날', w: 12 }, { h: '조회수', w: 11, t: 'n' }, { h: '요약 방식', w: 11 }, { h: '꿀팁 분류', w: 12 }, { h: '중요도', w: 8 },
    { h: '링크', w: 14, t: 'link' }, ...(rel ? [{ h: '관련도', w: 9, t: 'n' }] : []),
  ];
  const rows = LIST.map(n => [
    n.title, n.kind === 'tip' ? '꿀팁' : '영상', n._chan, n.subscriber_count || '', n._topics.join(', '),
    n._date, n._views || '', n.kind === 'tip' ? '' : (n.summary_src === 'video' ? '영상' : '설명란'), n.kind === 'tip' ? (n.category || '기타') : '', n.importance || '',
    [n.video_url || n.link_url || '', n.video_url ? 'YouTube' : '원문'], ...(rel ? [SCORES[n.id]] : []),
  ]);
  const now = new Date();
  const cond = [['내려받은 시각', now.toLocaleString('ko-KR')], ['건수', `${fmtNum(LIST.length)}건 / 전체 ${fmtNum(ALL.length)}건`],
    ['검색어', S.q || '-'], ['정렬', ($('sortSel').selectedOptions[0] || {}).textContent || '-'],
    ...activeChips().map(([, , l]) => ['필터', l]), ...(S.topics.size > 1 ? [['토픽 조건', S.topicMode === 'all' ? '모두 포함' : '하나라도 포함']] : [])];
  const main = Xlsx.sheet(cols, rows);
  const blob = Xlsx.book([
    { name: '목록', xml: main, filterRef: `$A$1:$${Xlsx.col(cols.length - 1)}$${rows.length + 1}` },
    { name: '조건', xml: Xlsx.sheet([{ h: '항목', w: 16 }, { h: '값', w: 60 }], cond, { freeze: false, filter: false }) },
  ]);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `ai-llm-wiki-${isoDay(now).replace(/-/g, '')}.xlsx`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

// ── (나) 지난 방문 뒤 새로 들어온 것 — 이 브라우저에만 기억한다 ──
let NEWSET = new Set();
function loadJson(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch { return null; } }
function saveJson(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* 저장을 막은 브라우저 */ } }
function computeNew() {
  const ids = ALL.map(n => n.id), now = Date.now();
  const seen = loadJson('wiki.seen'), prev = loadJson('wiki.new');
  let fresh = [];
  if (seen && Array.isArray(seen.ids)) { const s = new Set(seen.ids); fresh = ids.filter(i => !s.has(i)); }
  if (fresh.length) { NEWSET = new Set(fresh); saveJson('wiki.new', { ids: fresh, at: now }); }
  else if (prev && Array.isArray(prev.ids) && now - prev.at < 3 * dayMs) NEWSET = new Set(prev.ids.filter(i => BY_ID.has(i)));
  else NEWSET = new Set();
  saveJson('wiki.seen', { ids, at: now });
}

// ── (라) 노트 전체 보기 패널 + (가) 비슷한 영상 ──
let PANEL_ID = null, panelStack = [], BY_BASE = new Map();
function inl(s) {
  // 줄 안 표기: **굵게** · `코드` · [글](url) · [[노트|별칭]] · 맨 URL
  let t = esc(s);
  t = t.replace(/\[\[([^\]|]+?)(?:\|([^\]]+))?\]\]/g, (m, a, b) => {
    const key = nfc(a.split('/').pop().replace(/\.md$/, '').replace(/&amp;/g, '&'));
    const id = BY_BASE.get(key);
    return id ? `<a href="#" data-note="${esc(id)}">${b || a.split('/').pop()}</a>` : `<span class="wl">${b || a.split('/').pop()}</span>`;
  });
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  t = t.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  t = t.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*\*/g, '');
  return t;
}
function mdRender(src) {
  const lines = String(src || '').replace(/\r/g, '').split('\n').filter(l => !/^\*\*▶ 영상 보기/.test(l));
  let html = '', list = [], para = [];
  const flushPara = () => { if (para.length) { html += `<p>${para.map(inl).join('<br>')}</p>`; para = []; } };
  const closeLists = (depth = 0) => { while (list.length > depth) html += `</${list.pop()}>`; };
  for (const raw of lines) {
    const line = raw.replace(/\s+$/, '');
    let m;
    if (!line.trim()) { flushPara(); closeLists(); continue; }
    if ((m = line.match(/^(#{1,4})\s+(.*)$/))) { flushPara(); closeLists(); const lv = Math.min(m[1].length + 1, 4); html += `<h${lv}>${inl(m[2])}</h${lv}>`; continue; }
    if (/^-{3,}$/.test(line.trim())) { flushPara(); closeLists(); html += '<hr>'; continue; }
    if ((m = line.match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/))) {
      flushPara();
      const depth = Math.floor(m[1].replace(/\t/g, '  ').length / 2) + 1, tag = /\d/.test(m[2]) ? 'ol' : 'ul';
      if (list.length > depth) closeLists(depth);
      if (list.length === depth && list[depth - 1] !== tag) closeLists(depth - 1);
      while (list.length < depth) { html += `<${tag}>`; list.push(tag); }
      html += `<li>${inl(m[3])}</li>`; continue;
    }
    closeLists(); para.push(line.trim());
  }
  flushPara(); closeLists();
  return html;
}
async function openPanel(id, push = true) {
  const n = BY_ID.get(id); if (!n) return;
  if (push === true && PANEL_ID && PANEL_ID !== id) panelStack.push(PANEL_ID);
  if (push === false) panelStack = [];
  PANEL_ID = id;
  const p = $('panel');
  p.hidden = false; requestAnimationFrame(() => p.classList.add('show'));
  $('pBack').hidden = !panelStack.length;
  $('pTitle').innerHTML = esc(n.title);
  const meta = [n._chan, n.subscriber_count ? '구독 ' + fmtShort(n.subscriber_count) : '', n._views ? '조회 ' + fmtNum(n._views) + '회' : '', n._date].filter(Boolean).map(esc).join(' · ');
  $('pBody').innerHTML = `${n._vid ? `<a class="pthumb" href="${esc(n.video_url)}" target="_blank" rel="noopener">${thumb(n)}</a>` : ''}
    <div class="pmeta">${meta} ${badge(n)}${NEWSET.has(n.id) ? ' <span class="st new">새</span>' : ''}</div>${tagsHtml(n)}${linksHtml(n, true)}
    <div class="md" id="pMd"><p class="muted">불러오는 중입니다</p></div>
    <section class="sim"><h3>비슷한 영상</h3><div id="pSim" class="muted">찾는 중입니다</div></section>`;
  $('pBody').scrollTop = 0;
  writeHash();
  try {
    const r = await fetch('/api/wiki-note?id=' + encodeURIComponent(id));
    const d = await r.json();
    if (PANEL_ID !== id) return;
    $('pMd').innerHTML = r.ok ? mdRender(d.body) : `<p class="muted">${esc(d.error || '본문을 불러오지 못했습니다')}</p>`;
  } catch (e) { if (PANEL_ID === id) $('pMd').innerHTML = '<p class="muted">본문을 불러오지 못했습니다. 서버가 켜져 있는지 확인하세요.</p>'; }
  try {
    const r = await fetch('/api/wiki-search?similar=' + encodeURIComponent(id));
    const d = await r.json();
    if (PANEL_ID !== id) return;
    const items = (d.results || []).map(x => BY_ID.get(x.id)).filter(Boolean);
    $('pSim').className = '';
    $('pSim').innerHTML = items.length ? items.map(s => `<a href="#" class="simrow" data-note="${esc(s.id)}">${thumb(s)}<span><b>${esc(s.title)}</b><small>${esc([s._chan, s._date].filter(Boolean).join(' · '))}</small></span></a>`).join('') : '<span class="muted">찾지 못했습니다</span>';
  } catch (e) { if (PANEL_ID === id) $('pSim').textContent = '찾지 못했습니다'; }
}
function closePanel() {
  const p = $('panel'); if (p.hidden) return;
  p.classList.remove('show'); PANEL_ID = null; panelStack = [];
  setTimeout(() => { if (!PANEL_ID) p.hidden = true; }, 200);
  writeHash();
}

// ── 이벤트 ──
const on = (id, ev, fn) => $(id).addEventListener(ev, fn);
on('qform', 'submit', e => { e.preventDefault(); runSearch($('q').value); });
on('q', 'input', () => { $('qclear').style.display = $('q').value ? 'grid' : 'none'; });
on('qclear', 'click', () => { $('q').value = ''; runSearch(''); $('q').focus(); });
on('btnAsk', 'click', ask);
on('btnXlsx', 'click', exportXlsx);
on('pClose', 'click', closePanel);
on('pBack', 'click', () => { const prev = panelStack.pop(); if (prev) openPanel(prev, 'back'); });
on('fNew', 'change', e => { S.onlyNew = e.target.checked; apply(); });
document.addEventListener('click', e => {
  const a = e.target.closest('[data-note]');
  if (!a) return;
  e.preventDefault(); e.stopPropagation();
  openPanel(a.dataset.note, true);
}, true);
document.addEventListener('keydown', e => {
  const t = e.target.closest?.('.vcard .title[data-note]');
  if (t && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openPanel(t.dataset.note, true); }
});
const sideOpen = v => { $('side').classList.toggle('show', v); $('scrim').classList.toggle('show', v); };
on('btnFilter', 'click', () => sideOpen(true));
on('scrim', 'click', () => sideOpen(false));
on('sideClear', 'click', () => { clearFilters(); apply(); });
document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
  if (e.key === '/' && !typing) { e.preventDefault(); $('q').focus(); $('q').select(); }
  if (e.key === 'Escape') {
    if (!$('panel').hidden) closePanel();
    else if ($('side').classList.contains('show')) sideOpen(false);
    else if (document.activeElement === $('q') && $('q').value) { $('q').value = ''; runSearch(''); }
  }
});
function segClick(id, fn) {
  on(id, 'click', e => { const b = e.target.closest('button[data-v]'); if (b) { fn(b.dataset.v); apply(); } });
}
segClick('fKind', v => { S.kind = v; });
segClick('fTopicMode', v => { S.topicMode = v; });
segClick('fPeriod', v => { S.period = v; [S.from, S.to] = periodRange(v); });
segClick('fViews', v => { S.views = Number(v); });
segClick('fImportance', v => { S.imp.has(v) ? S.imp.delete(v) : S.imp.add(v); });
segClick('fView', v => { S.view = v; savePref('view', v); });
for (const [id, set] of [['fTopics', () => S.topics], ['fChannels', () => S.channels], ['fCategory', () => S.cats]]) {
  on(id, 'change', e => { const cb = e.target; if (cb.type !== 'checkbox') return; cb.checked ? set().add(cb.value) : set().delete(cb.value); apply(); });
}
on('fSummary', 'change', e => { S.summary = e.target.checked ? 'video' : 'all'; apply(); });
for (const id of ['dFrom', 'dTo']) on(id, 'change', () => {
  S.period = 'custom'; S.from = $('dFrom').value; S.to = $('dTo').value;
  if (!S.from && !S.to) S.period = 'all';
  apply();
});
on('topicFind', 'input', renderFacets);
on('chanFind', 'input', renderFacets);
on('chanMore', 'click', () => { chanLimit = chanLimit > 8 ? 8 : 60; renderFacets(); });
on('sortSel', 'change', e => {
  const k = e.target.value;
  if (k === 'date_asc') { S.sort = 'date'; S.dir = 'asc'; } else { S.sort = k; S.dir = (SORTS.find(s => s[0] === k) || [])[2] || 'desc'; }
  apply();
});
on('chips', 'click', e => {
  const b = e.target.closest('button[data-k]'); if (!b) return;
  const { k, v } = b.dataset;
  if (k === 'kind') S.kind = 'all';
  else if (k === 'topic') S.topics.delete(v);
  else if (k === 'period') { S.period = 'all'; S.from = S.to = ''; }
  else if (k === 'views') S.views = 0;
  else if (k === 'summary') S.summary = 'all';
  else if (k === 'chan') S.channels.delete(v);
  else if (k === 'cat') S.cats.delete(v);
  else if (k === 'imp') S.imp.delete(v);
  else if (k === 'new') S.onlyNew = false;
  apply();
});
on('answer', 'click', e => { if (e.target.id === 'ansClose') $('answer').style.display = 'none'; });
on('results', 'click', e => {
  if (e.target.id === 'emptyClear') { clearFilters(); apply(); return; }
  const sb = e.target.closest('button[data-sort]');
  if (sb) {
    const k = sb.dataset.sort;
    if (S.sort === k) S.dir = S.dir === 'asc' ? 'desc' : 'asc';
    else { S.sort = k; S.dir = ['title', 'channel', 'topic'].includes(k) ? 'asc' : 'desc'; }
    apply(); return;
  }
  const tg = e.target.closest('.tag[data-topic]');
  if (tg) { const t = tg.dataset.topic; S.topics.has(t) ? S.topics.delete(t) : S.topics.add(t); apply(); return; }
  const tc = e.target.closest('.tag[data-cat]');
  if (tc) { const c = tc.dataset.cat; S.cats.has(c) ? S.cats.delete(c) : S.cats.add(c); apply(); return; }
  if (e.target.closest('a')) return;
  const row = e.target.closest('tr.row');
  if (row) toggleRow(row);
});
on('results', 'keydown', e => {
  const row = e.target.closest('tr.row');
  if (row && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggleRow(row); }
});
function toggleRow(row) {
  const id = row.dataset.id;
  const prev = $('tb').querySelector('tr.row.open');
  if (prev) {
    prev.classList.remove('open'); prev.setAttribute('aria-expanded', 'false');
    if (prev.nextElementSibling?.classList.contains('detail')) prev.nextElementSibling.remove();
  }
  if (openId === id) { openId = null; return; }
  openId = id;
  row.classList.add('open'); row.setAttribute('aria-expanded', 'true');
  row.insertAdjacentHTML('afterend', detailHtml(BY_ID.get(id)));
}
window.addEventListener('hashchange', () => { const before = S.q; readHash(); if (S.q !== before) runSearch(S.q); else apply(); });

// ── 시작 ──
(async () => {
  readHash();
  try {
    await loadAll();
    if (S.q) await runSearch(S.q); else apply();
    const nid = new URLSearchParams(location.hash.slice(1)).get('note');
    if (nid && BY_ID.has(nid)) openPanel(nid, false);
  } catch (e) {
    $('results').innerHTML = `<div class="card empty"><b>목록을 불러오지 못했습니다</b>${esc(e.message)}. 서버가 켜져 있는지 확인한 뒤 새로고침하세요.</div>`;
  }
})();
</script>
